<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:none;display:flex;justify-content:space-around;padding:8px 4px 28px;background:var(--card);border-top:1px solid var(--line)">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
    <div style="{{ t.st }}">
      <div style="{{ t.pill }}">
        <x-import component="Icono" from="./icono.js" n="{{ t.i }}" s="22" hint-size="22px,22px"></x-import>
        <sc-if value="{{ t.badge }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;top:-2px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--btn);color:var(--btn-ink);font:600 11px var(--ui);display:flex;align-items:center;justify-content:center;padding:0 4px;box-sizing:border-box;border:2px solid var(--card)">{{ t.badge }}</span>
        </sc-if>
      </div>
      <span>{{ t.l }}</span>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.a ?? 'inicio';
    const list = [['inicio', 'Inicio', 'home'], ['revisar', 'Revisar', 'inbox', '4'], ['pagos', 'Pagos', 'cal'], ['movs', 'Movimientos', 'list'], ['ajustes', 'Ajustes', 'gear']];
    return {
      tabs: list.map(([id, l, i, badge]) => {
        const on = id === a;
        return {
          l, i, badge: badge || '',
          st: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, flex: 1, minWidth: 0, font: (on ? '600' : '500') + ' 10.5px var(--ui)', letterSpacing: '-0.01em', color: on ? 'var(--ink)' : 'var(--ink2)' },
          pill: { position: 'relative', width: 58, height: 30, borderRadius: 99, display: 'flex', alignItems: 'center', justifyContent: 'center', background: on ? 'var(--sunk)' : 'transparent', boxShadow: on ? 'inset 0 0 0 1.5px var(--ink)' : 'none' }
        };
      })
    };
  }
}
</script>
</body>
</html>
