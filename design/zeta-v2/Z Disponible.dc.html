<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ sv }}">
  <div style="background:var(--dbg);color:var(--dfg);border-radius:24px;padding:16px 20px 18px;container-type:inline-size;box-shadow:var(--shadow);display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <span style="display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:99px;background:var(--dpb);color:var(--dpx);font:600 13px var(--ui);white-space:nowrap"><span style="width:8px;height:8px;border-radius:9px;background:var(--ddot)"></span>{{ verdict }}</span>
      <span style="font:500 13px var(--ui);color:var(--d2);white-space:nowrap">Te pagan en {{ dias }} días</span>
    </div>
    <div style="font:600 14px var(--ui);margin-top:14px">Disponible</div>
    <div style="font-family:var(--num);font-weight:800;font-size:min(64px,17.5cqw);line-height:1.02;letter-spacing:-0.045em;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:2px">{{ amt }}</div>
    <div style="display:flex;justify-content:space-between;gap:4px 10px;margin-top:12px;font:500 13px var(--ui);color:var(--d2);flex-wrap:wrap">
      <span><span style="font:600 14px var(--num);color:var(--dfg)">{{ dia }}</span> al día</span>
      <span>+{{ mas }} cuando te paguen</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:358,&quot;height&quot;:200},&quot;st&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;warn&quot;,&quot;bad&quot;],&quot;default&quot;:&quot;ok&quot;,&quot;tsType&quot;:&quot;'ok'|'warn'|'bad'&quot;},&quot;amt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;$421.100&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dia&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;$35.000&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dias&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const st = this.props.st ?? 'ok';
    const D = { ok: ['Vas bien', '$421.100', '$35.000'], warn: ['Cuidado', '$271.100', '$22.500'], bad: ['Te pasaste', '−$48.000', '$0'] }[st] || [];
    const sv = {};
    ['bg', 'fg', '2', 'pb', 'px', 'dot'].forEach(k => { sv['--d' + (k === 'bg' || k === 'fg' ? k : k === '2' ? '2' : k === 'dot' ? 'dot' : k)] = `var(--d-${st}-${k})`; });
    return { sv, verdict: D[0], amt: this.props.amt ?? D[1], dia: this.props.dia ?? D[2], dias: this.props.dias ?? 12, mas: this.props.mas ?? '$2.100.000' };
  }
}
</script>
</body>
</html>
