name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/workflows/pr-build-images.yml'
      - 'webapp/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'services/pdf_parser/**'
      - 'docker-compose.prod.yml'
      - 'infra/**'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force full rebuild (skip image promotion)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  REPO: cristian1911/personal_finance_manager_claude
  GHCR_USERNAME: cristian1911

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      webapp_changed: ${{ steps.set-outputs.outputs.webapp_changed }}
      parser_changed: ${{ steps.set-outputs.outputs.parser_changed }}
      any_deploy: ${{ steps.set-outputs.outputs.any_deploy }}
      merge_sha: ${{ steps.find-pr.outputs.merge_sha }}
      webapp_latest_missing: ${{ steps.latest-tags.outputs.webapp_missing }}
      parser_latest_missing: ${{ steps.latest-tags.outputs.parser_missing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            webapp:
              - 'webapp/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            parser:
              - 'services/pdf_parser/**'
            deploy:
              - 'docker-compose.prod.yml'
              - 'infra/**'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/pr-build-images.yml'

      # Un tag -latest puede desaparecer del registry aunque su código no haya
      # cambiado: el cleanup semanal de GHCR borra manifests hijo sin tag, y los
      # builds de buildx publican un índice cuyos hijos (imagen + attestation)
      # van justamente sin tag. El VPS hace `docker compose pull` de AMBOS
      # servicios en cada deploy, así que ambos tags tienen que existir siempre.
      # Si falta uno, forzamos su rebuild en vez de abortar con `manifest
      # unknown` (que fue lo que rompió el deploy del 2026-08-04).
      - name: Check -latest tags still exist in GHCR
        id: latest-tags
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT_READ || github.token }}
        run: |
          set -uo pipefail

          if ! echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin; then
            # No podemos consultar el registry. Asumir "falta" es el lado seguro:
            # reconstruir de más solo cuesta tiempo, dar por existente una imagen
            # ausente tumba producción en el `docker compose down` del VPS.
            echo "::warning::No se pudo autenticar contra $REGISTRY — se fuerza rebuild de ambas imágenes."
            echo "webapp_missing=true" >> "$GITHUB_OUTPUT"
            echo "parser_missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for img in webapp parser; do
            if docker manifest inspect "${REGISTRY}/${REPO}:${img}-latest" > /dev/null 2>&1; then
              echo "${img}-latest presente en el registry."
              echo "${img}_missing=false" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::${img}-latest no está en el registry — se fuerza su rebuild."
              echo "${img}_missing=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Find PR merge SHA
        id: find-pr
        if: inputs.force_build != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Look up the merged PR to find the head SHA that was built in CI.
          # Works with squash, merge commit, and rebase merge strategies.
          PR_DATA=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0] | {sha: .head.sha, number: .number}' 2>/dev/null || echo '{}')
          MERGE_SHA=$(echo "$PR_DATA" | jq -r '.sha // empty')
          PR_NUMBER=$(echo "$PR_DATA" | jq -r '.number // empty')

          if [ -n "$MERGE_SHA" ]; then
            echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
            echo "Found PR #${PR_NUMBER} with head SHA: ${MERGE_SHA}"
          else
            echo "merge_sha=" >> "$GITHUB_OUTPUT"
            echo "No PR found — will do full build"
          fi

      - name: Set outputs
        id: set-outputs
        run: |
          IS_DISPATCH="${{ github.event_name == 'workflow_dispatch' }}"
          WEBAPP="${{ steps.filter.outputs.webapp }}"
          PARSER="${{ steps.filter.outputs.parser }}"
          DEPLOY_FILES="${{ steps.filter.outputs.deploy }}"

          if [ "$IS_DISPATCH" = "true" ] || [ "$WEBAPP" = "true" ]; then
            echo "webapp_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "webapp_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$IS_DISPATCH" = "true" ] || [ "$PARSER" = "true" ]; then
            echo "parser_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "parser_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$IS_DISPATCH" = "true" ] || \
             [ "$WEBAPP" = "true" ] || \
             [ "$PARSER" = "true" ] || \
             [ "$DEPLOY_FILES" = "true" ]; then
            echo "any_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  promote-webapp:
    if: |
      needs.changes.outputs.webapp_changed == 'true' ||
      needs.changes.outputs.webapp_latest_missing == 'true'
    runs-on: ubuntu-latest
    needs: [changes]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ github.token }}

      - name: Reset Docker Hub auth
        run: docker logout docker.io || true

      - name: Log in to Docker Hub for Buildx pulls
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "Docker Hub credentials not configured; continuing without explicit login."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Retag PR image as latest
        id: retag
        continue-on-error: true
        if: needs.changes.outputs.merge_sha != ''
        run: |
          SHA_TAG="${{ env.REGISTRY }}/${{ env.REPO }}:webapp-sha-${{ needs.changes.outputs.merge_sha }}"
          LATEST_TAG="${{ env.REGISTRY }}/${{ env.REPO }}:webapp-latest"

          echo "Promoting $SHA_TAG → $LATEST_TAG"
          docker buildx imagetools create --tag "$LATEST_TAG" "$SHA_TAG"

      - name: Full build (direct push, workflow_dispatch, or missing PR image)
        if: steps.retag.outcome == 'skipped' || steps.retag.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./webapp/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}:webapp-latest
          secrets: |
            npm_token=${{ secrets.NPM_TOKEN }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}
            NEXT_PUBLIC_BUILD_TIME=${{ github.event.head_commit.timestamp }}
            NEXT_PUBLIC_EMAIL_INGEST_DOMAIN=${{ secrets.NEXT_PUBLIC_EMAIL_INGEST_DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-parser:
    if: |
      needs.changes.outputs.parser_changed == 'true' ||
      needs.changes.outputs.parser_latest_missing == 'true'
    runs-on: ubuntu-latest
    needs: [changes]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ github.token }}

      - name: Reset Docker Hub auth
        run: docker logout docker.io || true

      - name: Log in to Docker Hub for Buildx pulls
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "Docker Hub credentials not configured; continuing without explicit login."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Retag PR image as latest
        id: retag
        continue-on-error: true
        if: needs.changes.outputs.merge_sha != ''
        run: |
          SHA_TAG="${{ env.REGISTRY }}/${{ env.REPO }}:parser-sha-${{ needs.changes.outputs.merge_sha }}"
          LATEST_TAG="${{ env.REGISTRY }}/${{ env.REPO }}:parser-latest"

          echo "Promoting $SHA_TAG → $LATEST_TAG"
          docker buildx imagetools create --tag "$LATEST_TAG" "$SHA_TAG"

      - name: Full build (direct push, workflow_dispatch, or missing PR image)
        if: steps.retag.outcome == 'skipped' || steps.retag.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: ./services/pdf_parser
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}:parser-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: |
      always() &&
      needs.changes.outputs.any_deploy == 'true' &&
      needs.promote-webapp.result != 'failure' &&
      needs.promote-parser.result != 'failure'
    runs-on: ubuntu-latest
    needs: [changes, promote-webapp, promote-parser]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GHCR token can read images
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT_READ }}

      - name: Verify images are pullable from GHCR
        run: |
          docker manifest inspect ${{ env.REGISTRY }}/${{ env.REPO }}:webapp-latest > /dev/null
          docker manifest inspect ${{ env.REGISTRY }}/${{ env.REPO }}:parser-latest > /dev/null

      - name: Deploy to VPS via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail

          # Fail fast with a clear message if required secrets are missing,
          # instead of dying with an opaque exit code further down.
          if [ -z "${VPS_HOST:-}" ]; then
            echo "::error::VPS_HOST secret is empty — cannot deploy."
            exit 1
          fi
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::VPS_SSH_KEY secret is empty — cannot deploy."
            exit 1
          fi

          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Populate known_hosts. Do NOT let a transient ssh-keyscan failure abort
          # the step silently (the old `2>/dev/null` under `set -e` swallowed the
          # real reason every deploy died). Surface the error and keep going — the
          # scp/ssh below uses accept-new and will report the true failure.
          echo ">>> Scanning host key for VPS..."
          if ! ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
            echo "::warning::ssh-keyscan could not reach the VPS:"
            cat /tmp/keyscan.err || true
          fi

          SSH_OPTS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)

          # The VPS is occasionally unreachable from the runner on the first try
          # (transient blip), so retry the connection-bound steps. 3 attempts,
          # fixed backoff. Both remote operations are idempotent, so re-running
          # is safe.
          retry() {
            local n=1 max=3 delay=10
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "::error::command failed after ${max} attempts: $*"
                return 1
              fi
              echo "::warning::attempt ${n}/${max} failed; retrying in ${delay}s..."
              sleep "$delay"
              n=$((n + 1))
            done
          }

          # Sync compose file to VPS
          echo ">>> Copying docker-compose.prod.yml to VPS..."
          retry scp "${SSH_OPTS[@]}" docker-compose.prod.yml "root@${VPS_HOST}:/docker/personal-finance-manager/docker-compose.yml"

          # Deploy: down (remove orphans) → pull → up. The remote script lives in
          # a file so each retry re-reads it — a heredoc on stdin is consumed by
          # the first attempt, leaving later attempts with empty input.
          echo ">>> Running remote deploy..."
          DEPLOY_SCRIPT_FILE="$(mktemp)"
          cat > "$DEPLOY_SCRIPT_FILE" <<'DEPLOY_SCRIPT'
            set -euo pipefail
            cd /docker/personal-finance-manager
            echo ">>> Stopping containers and removing orphans..."
            docker compose down --remove-orphans
            echo ">>> Pulling latest images..."
            docker compose pull
            echo ">>> Starting fresh containers..."
            docker compose up -d
            echo ">>> Waiting for health checks..."
            docker compose ps
          DEPLOY_SCRIPT
          deploy_remote() {
            ssh "${SSH_OPTS[@]}" "root@${VPS_HOST}" bash -s < "$DEPLOY_SCRIPT_FILE"
          }
          retry deploy_remote
          rm -f "$DEPLOY_SCRIPT_FILE"

          # Cleanup
          rm -f ~/.ssh/deploy_key
