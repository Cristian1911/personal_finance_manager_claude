name: PR Build & Verify

# Two concerns:
# 1. VERIFY (every push): build check + audit — catches errors early, no GHCR push
# 2. PUBLISH (on-demand): build + push image — only when labeled or ready for review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/pr-build-images.yml'
      - '.github/workflows/deploy.yml'
      - 'webapp/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'services/pdf_parser/**'

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REPO: cristian1911/personal_finance_manager_claude
  GHCR_USERNAME: cristian1911

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      webapp_changed: ${{ steps.filter.outputs.webapp }}
      parser_changed: ${{ steps.filter.outputs.parser }}
      should_publish: ${{ steps.publish-gate.outputs.should_publish }}
    steps:
      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            webapp:
              - 'webapp/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            parser:
              - 'services/pdf_parser/**'

      - name: Check publish gate
        id: publish-gate
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          if echo "$PR_LABELS" | grep -q "build-image"; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_ACTION" = "ready_for_review" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── VERIFY: runs on every push, no GHCR interaction ────────────────────────

  verify-webapp:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.webapp_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build webapp
        run: pnpm --filter webapp build

      - name: Audit (high/critical only)
        run: pnpm audit --audit-level high || true

  verify-parser:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.parser_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Check parser builds
        working-directory: services/pdf_parser
        run: |
          uv sync
          uv run python -c "from main import app; print('Parser imports OK')"

  # ─── PUBLISH: only when labeled or ready for review ─────────────────────────

  build-and-push-webapp:
    runs-on: ubuntu-latest
    needs: [changes, verify-webapp]
    if: |
      needs.changes.outputs.should_publish == 'true' &&
      needs.changes.outputs.webapp_changed == 'true' &&
      github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ github.token }}

      - name: Reset Docker Hub auth
        run: docker logout docker.io || true

      - name: Log in to Docker Hub for Buildx pulls
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "Docker Hub credentials not configured; continuing without explicit login."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push webapp image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./webapp/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}:webapp-sha-${{ github.event.pull_request.head.sha }}
          secrets: |
            npm_token=${{ secrets.NPM_TOKEN }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_BUILD_SHA=${{ github.event.pull_request.head.sha }}
            NEXT_PUBLIC_BUILD_TIME=${{ github.event.pull_request.updated_at }}
            NEXT_PUBLIC_EMAIL_INGEST_DOMAIN=${{ secrets.NEXT_PUBLIC_EMAIL_INGEST_DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-parser:
    runs-on: ubuntu-latest
    needs: [changes, verify-parser]
    if: |
      needs.changes.outputs.should_publish == 'true' &&
      needs.changes.outputs.parser_changed == 'true' &&
      github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ github.token }}

      - name: Reset Docker Hub auth
        run: docker logout docker.io || true

      - name: Log in to Docker Hub for Buildx pulls
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "Docker Hub credentials not configured; continuing without explicit login."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push pdf-parser image
        uses: docker/build-push-action@v6
        with:
          context: ./services/pdf_parser
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}:parser-sha-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
