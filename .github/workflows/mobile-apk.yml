name: Build Mobile APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK variant to build
        type: choice
        required: true
        default: release
        options:
          - release
          - debug
      app:
        description: Which app (v2 = the rebuild, on the v2 Supabase project; never v1's data)
        type: choice
        required: true
        default: v1
        options:
          - v1
          - v2
      api_target:
        description: API URL target embedded in build
        type: choice
        required: true
        default: device
        options:
          - device
          - local
  # push trigger disabled — re-enable when mobile development resumes
  # push:
  #   branches: [main]
  #   paths:
  #     - '.github/workflows/mobile-apk.yml'
  #     - 'mobile/**'
  #     - 'packages/shared/**'
  #     - 'package.json'
  #     - 'pnpm-lock.yaml'
  #     - 'pnpm-workspace.yaml'

env:
  NODE_VERSION: '20'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Resolve build options
        run: |
          VARIANT="${{ github.event.inputs.variant }}"
          API_TARGET="${{ github.event.inputs.api_target }}"

          if [ -z "$VARIANT" ]; then
            VARIANT="release"
          fi
          if [ -z "$API_TARGET" ]; then
            API_TARGET="device"
          fi

          APP="${{ github.event.inputs.app }}"
          if [ -z "$APP" ]; then
            APP="v1"
          fi

          echo "APK_VARIANT=$VARIANT" >> "$GITHUB_ENV"
          echo "API_TARGET=$API_TARGET" >> "$GITHUB_ENV"
          echo "APP=$APP" >> "$GITHUB_ENV"

          if [ "$VARIANT" = "release" ]; then
            echo "GRADLE_TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "APK_PATH=mobile/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "GRADLE_TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "APK_PATH=mobile/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Set EXPO_PUBLIC_API_URL
        env:
          DEVICE_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          if [ "$API_TARGET" = "local" ]; then
            echo "EXPO_PUBLIC_API_URL=http://10.0.2.2:3000" >> "$GITHUB_ENV"
          else
            if [ -z "$DEVICE_API_URL" ]; then
              echo "Missing required secret EXPO_PUBLIC_API_URL for device builds." >&2
              exit 1
            fi
            echo "EXPO_PUBLIC_API_URL=$DEVICE_API_URL" >> "$GITHUB_ENV"
          fi

      # v1 builds use the production project; v2 builds use the v2 project (zeta-dev until launch)
      # and turn the v2 screens on. A v2 build must never point at v1's production data.
      - name: Resolve Supabase project
        env:
          V1_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          V1_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          V2_URL: ${{ secrets.V2_SUPABASE_URL }}
          V2_KEY: ${{ secrets.V2_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ "$APP" = "v2" ]; then
            if [ -z "$V2_URL" ] || [ -z "$V2_KEY" ]; then
              echo "Missing required secrets for v2: V2_SUPABASE_URL and/or V2_SUPABASE_PUBLISHABLE_KEY" >&2
              exit 1
            fi
            if [ "$V2_URL" = "$V1_URL" ]; then
              echo "V2_SUPABASE_URL is v1's production project: refusing to build v2 against it." >&2
              exit 1
            fi
            echo "::add-mask::$V2_KEY"
            { echo "EXPO_PUBLIC_SUPABASE_URL=$V2_URL"; echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$V2_KEY"; echo "EXPO_PUBLIC_ZETA_V2=1"; } >> "$GITHUB_ENV"
          else
            if [ -z "$V1_URL" ] || [ -z "$V1_KEY" ]; then
              echo "Missing required secrets: NEXT_PUBLIC_SUPABASE_URL and/or NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >&2
              exit 1
            fi
            echo "::add-mask::$V1_KEY"
            { echo "EXPO_PUBLIC_SUPABASE_URL=$V1_URL"; echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$V1_KEY"; } >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android native project
        env:
          EXPO_NO_GIT_STATUS: '1'
        run: pnpm --filter mobile exec expo prebuild --platform android --non-interactive --no-install

      - name: Configure Android SDK path for Gradle
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > mobile/android/local.properties

      - name: Build APK
        env:
          # Same public client ids as eas.json (Google sign-in); the Supabase project comes from the step above.
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 1027538281655-dveo3pn7m1s9es0lsjkmuat4u536lpgh.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 1027538281655-dh3so5rl229inv5djocenpdh546pij7o.apps.googleusercontent.com
        run: |
          cd mobile/android
          ./gradlew app:$GRADLE_TASK -x lint -x test --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          APK_NAME="zeta-${APP}-${APK_VARIANT}-${API_TARGET}-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK_PATH" "dist/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk-${{ env.APP }}-${{ env.APK_VARIANT }}-${{ env.API_TARGET }}-${{ github.run_number }}
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          tag: android-apk-latest${{ env.APP == 'v2' && '-v2' || '' }}
          name: Android APK (latest${{ env.APP == 'v2' && ', v2' || '' }})
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: dist/${{ env.APK_NAME }}
          body: |
            Latest Android APK built from `${{ github.sha }}`.

            - App: `${{ env.APP }}`
            - Variant: `${{ env.APK_VARIANT }}`
            - API target: `${{ env.API_TARGET }}`
            - Run: `${{ github.run_number }}`

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Mobile APK build"
            echo ""
            printf -- "- App: \`%s\`\n" "${APP:-n/a}"
            printf -- "- Variant: \`%s\`\n" "${APK_VARIANT:-n/a}"
            printf -- "- API target: \`%s\`\n" "${API_TARGET:-n/a}"
            printf -- "- Artifact: \`%s\`\n" "${APK_NAME:-n/a}"
            echo ""
            echo "Release download page: https://github.com/${{ github.repository }}/releases/tag/android-apk-latest${{ env.APP == 'v2' && '-v2' || '' }}"
          } >> "$GITHUB_STEP_SUMMARY"
