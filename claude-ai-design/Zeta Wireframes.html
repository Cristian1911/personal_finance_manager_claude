<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1400"/>
<title>Zeta Wireframes</title>
<style>
/* Zeta wireframe system — dark, low-fi, hand-drawn-ish */

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Architects+Daughter&family=Kalam:wght@300;400;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --z-ink: #121412;
  --z-surface: #171A17;
  --z-surface-2: #1E221E;
  --z-surface-3: #262B26;
  --z-olive-deep: #3F4632;
  --z-sage: #768053;
  --z-sage-light: #D9CCB9;
  --z-sage-dark: #938C7E;
  --z-brass: #937844;
  --z-white: #F6F0E3;

  --z-income: #5CB88A;
  --z-expense: #E8875A;
  --z-debt: #E05545;
  --z-alert: #D4A843;
  --z-excellent: #3D9E6E;

  --z-border: rgba(217, 204, 185, 0.08);
  --z-border-strong: rgba(217, 204, 185, 0.16);
  --z-border-sketch: rgba(217, 204, 185, 0.22);

  --hand: 'Kalam', 'Caveat', cursive;
  --hand-tight: 'Architects Daughter', 'Kalam', cursive;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --sans: 'Inter', system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--z-ink);
  color: var(--z-sage-light);
  font-family: var(--sans);
  font-feature-settings: 'tnum' 1, 'cv11' 1;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

#root {
  min-height: 100vh;
}

/* ---------- Hand-drawn primitives ---------- */

.hand { font-family: var(--hand); }
.hand-tight { font-family: var(--hand-tight); }
.mono { font-family: var(--mono); }
.tnum { font-variant-numeric: tabular-nums; }

.eyebrow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--z-sage-dark);
  font-family: var(--sans);
  white-space: nowrap;
}

.label-mono {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--z-sage-dark);
}

/* Hand-drawn box: wobbled border using svg background */
.sketch-box {
  position: relative;
  background: rgba(38, 43, 38, 0.35);
  border-radius: 14px;
}
.sketch-box::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: var(--z-border-sketch);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  pointer-events: none;
}

.sketch-box-strong::before {
  background: var(--z-border-strong);
}

.sketch-fill {
  background: rgba(30, 34, 30, 0.7);
}

.sketch-fill-2 {
  background: rgba(38, 43, 38, 0.55);
}

.sketch-fill-brass {
  background: rgba(147, 120, 68, 0.12);
}

/* Dashed box for placeholders / empty */
.dashed-box {
  border: 1.2px dashed var(--z-border-strong);
  border-radius: 14px;
  background: transparent;
}

.dashed-box-brass {
  border: 1.2px dashed rgba(147, 120, 68, 0.35);
  border-radius: 14px;
}

/* Placeholder stripes — for image / chart placeholders */
.placeholder-stripe {
  background-image: repeating-linear-gradient(
    -45deg,
    rgba(217, 204, 185, 0.04) 0,
    rgba(217, 204, 185, 0.04) 6px,
    transparent 6px,
    transparent 12px
  );
}

/* Squiggly underline for tappable hints */
.squiggle {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 4'><path d='M0 2 Q 2.5 0 5 2 T 10 2 T 15 2 T 20 2' fill='none' stroke='%23937844' stroke-width='0.8'/></svg>");
  background-repeat: repeat-x;
  background-position: 0 100%;
  background-size: 12px 4px;
  padding-bottom: 4px;
}

/* Annotation chip — sticky-note style */
.annotation {
  font-family: var(--hand);
  color: var(--z-brass);
  font-size: 14px;
  line-height: 1.3;
  letter-spacing: 0.01em;
}

.annotation-strong {
  color: var(--z-white);
}

.anno-arrow {
  color: var(--z-brass);
  opacity: 0.7;
}

/* Chip */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.02em;
  border: 1px solid var(--z-border-strong);
  background: rgba(18, 20, 18, 0.4);
  color: var(--z-sage-light);
  white-space: nowrap;
  flex-shrink: 0;
}

.chip-brass { border-color: rgba(147, 120, 68, 0.35); color: var(--z-brass); background: rgba(147, 120, 68, 0.08); }
.chip-income { border-color: rgba(92, 184, 138, 0.35); color: var(--z-income); background: rgba(92, 184, 138, 0.08); }
.chip-expense { border-color: rgba(232, 135, 90, 0.35); color: var(--z-expense); background: rgba(232, 135, 90, 0.08); }
.chip-debt { border-color: rgba(224, 85, 69, 0.35); color: var(--z-debt); background: rgba(224, 85, 69, 0.08); }
.chip-alert { border-color: rgba(212, 168, 67, 0.35); color: var(--z-alert); background: rgba(212, 168, 67, 0.08); }

/* ---------- Phone frame ---------- */
.phone {
  width: 300px;
  height: 620px;
  background: var(--z-ink);
  border-radius: 36px;
  border: 1px solid var(--z-border-strong);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.03),
    0 20px 40px -20px rgba(0,0,0,0.8),
    0 0 0 6px #0a0b0a,
    0 0 0 7px rgba(217, 204, 185, 0.08);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}

.phone-screen {
  position: absolute;
  inset: 10px;
  border-radius: 28px;
  overflow: hidden;
  background: var(--z-ink);
  display: flex;
  flex-direction: column;
}

.phone-notch {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 22px;
  background: #000;
  border-radius: 14px;
  z-index: 10;
}

.phone-status {
  display: flex;
  justify-content: space-between;
  padding: 14px 22px 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--z-sage-light);
  letter-spacing: 0.02em;
}

.phone-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 16px 80px;
  scrollbar-width: none;
}
.phone-body::-webkit-scrollbar { display: none; }

.phone-tabbar {
  position: absolute;
  bottom: 10px;
  left: 10px;
  right: 10px;
  height: 62px;
  background: rgba(18, 20, 18, 0.92);
  border-top: 1px solid var(--z-border);
  display: flex;
  align-items: flex-start;
  padding: 8px 4px 0;
  backdrop-filter: blur(10px);
}

.tab-slot {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 9px;
  color: var(--z-sage-dark);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 500;
}
.tab-slot.active { color: var(--z-white); }
.tab-slot .tab-ico {
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
}

.tab-fab {
  width: 46px; height: 46px;
  border-radius: 50%;
  background: var(--z-brass);
  color: var(--z-ink);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 600;
  margin-top: -12px;
  box-shadow: 0 6px 18px -4px rgba(147,120,68,0.6);
}

/* ---------- Storyboard layout ---------- */
.storyboard-shell {
  max-width: 1680px;
  margin: 0 auto;
  padding: 32px 36px 120px;
}

.flow-strip {
  margin-bottom: 72px;
}

.flow-strip-head {
  display: flex;
  align-items: baseline;
  gap: 18px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}

.flow-title {
  font-family: var(--sans);
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--z-white);
}

.flow-sub {
  font-family: var(--hand);
  color: var(--z-sage-dark);
  font-size: 18px;
}

.flow-kicker {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--z-brass);
  margin-bottom: 8px;
}

.flow-strip-rail {
  display: flex;
  gap: 28px;
  overflow-x: auto;
  padding: 32px 8px 36px;
  scrollbar-width: thin;
  scrollbar-color: var(--z-border-strong) transparent;
}
.flow-strip-rail::-webkit-scrollbar { height: 8px; }
.flow-strip-rail::-webkit-scrollbar-thumb { background: var(--z-border-strong); border-radius: 4px; }
.flow-strip-rail::-webkit-scrollbar-track { background: transparent; }

.frame-slot {
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
}

.frame-num {
  position: absolute;
  top: -22px;
  left: -6px;
  font-family: var(--hand);
  font-size: 28px;
  font-weight: 700;
  color: var(--z-brass);
  opacity: 0.85;
  z-index: 2;
}

.frame-caption {
  font-family: var(--hand);
  color: var(--z-sage-light);
  font-size: 15px;
  line-height: 1.25;
  max-width: 300px;
  padding: 0 6px;
}
.frame-caption b { color: var(--z-white); font-weight: 700; }

.frame-step {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--z-sage-dark);
}

/* Arrow between frames */
.frame-arrow {
  align-self: center;
  display: flex;
  align-items: center;
  color: var(--z-brass);
  opacity: 0.6;
  flex-shrink: 0;
  transform: translateY(-20px);
  font-family: var(--hand);
}

/* Annotation callout lines */
.callout-group {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.callout {
  position: absolute;
  pointer-events: auto;
  font-family: var(--hand);
  color: var(--z-brass);
  font-size: 13px;
  line-height: 1.3;
  max-width: 180px;
}

/* ---------- Sketch chart primitives ---------- */
.spark {
  width: 100%;
  height: 28px;
  opacity: 0.9;
}

.ring {
  position: relative;
  width: 42px;
  height: 42px;
}

/* Progress bar */
.bar-track {
  height: 4px;
  border-radius: 999px;
  background: rgba(217, 204, 185, 0.1);
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: inherit;
}

/* Intro / section banners */
.banner {
  margin-bottom: 28px;
  padding: 20px 24px;
  border-radius: 18px;
  border: 1px solid var(--z-border);
  background: linear-gradient(180deg, rgba(38,43,38,0.6), rgba(23,26,23,0.3));
  display: flex;
  gap: 24px;
  align-items: flex-start;
}

.banner-kicker {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--z-brass);
  margin-bottom: 6px;
}

.banner h2 {
  font-family: var(--sans);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--z-white);
  margin: 0 0 4px 0;
}

.banner p {
  font-family: var(--hand);
  font-size: 16px;
  color: var(--z-sage-light);
  line-height: 1.4;
  margin: 0;
  max-width: 900px;
}

/* Tabs / flow selector */
.flow-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 6px;
  border: 1px solid var(--z-border);
  border-radius: 14px;
  background: rgba(23, 26, 23, 0.6);
  margin-bottom: 24px;
  position: sticky;
  top: 12px;
  z-index: 40;
  backdrop-filter: blur(8px);
}

.flow-nav button {
  background: transparent;
  border: 0;
  padding: 8px 12px;
  color: var(--z-sage-dark);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.02em;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: color 0.12s, background 0.12s;
}
.flow-nav button:hover { color: var(--z-sage-light); background: rgba(38, 43, 38, 0.6); }
.flow-nav button.active {
  color: var(--z-ink);
  background: var(--z-brass);
  font-weight: 600;
}
.flow-nav button .flow-num {
  font-family: var(--mono);
  font-size: 10px;
  opacity: 0.7;
}

/* Hero of the page */
.page-hero {
  padding: 40px 0 24px;
  border-bottom: 1px solid var(--z-border);
  margin-bottom: 32px;
}
.page-hero .eyebrow { margin-bottom: 14px; }
.page-hero h1 {
  font-size: 48px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--z-white);
  margin: 0 0 8px;
  line-height: 1;
}
.page-hero h1 em {
  font-style: normal;
  font-family: var(--hand);
  color: var(--z-brass);
  font-weight: 500;
}
.page-hero p {
  font-family: var(--hand);
  color: var(--z-sage-light);
  font-size: 18px;
  line-height: 1.5;
  max-width: 760px;
  margin: 8px 0 0;
}

/* Tweak panel */
.tweaks-fab {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 100;
  padding: 10px 16px;
  background: var(--z-brass);
  color: var(--z-ink);
  border-radius: 999px;
  font-family: var(--sans);
  font-weight: 600;
  font-size: 13px;
  border: 0;
  cursor: pointer;
  box-shadow: 0 12px 30px -10px rgba(147,120,68,0.7);
  display: flex;
  align-items: center;
  gap: 8px;
}

.tweaks-panel {
  position: fixed;
  right: 24px;
  bottom: 72px;
  width: 280px;
  background: var(--z-surface-2);
  border: 1px solid var(--z-border-strong);
  border-radius: 14px;
  padding: 16px;
  z-index: 100;
  box-shadow: 0 20px 50px -10px rgba(0,0,0,0.7);
}

.tweaks-panel h4 {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--z-brass);
  margin: 0 0 10px;
}

.tweaks-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-top: 1px solid var(--z-border);
  font-size: 12px;
  color: var(--z-sage-light);
  gap: 8px;
}

.pill-toggle {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--z-border-strong);
  border-radius: 999px;
  background: var(--z-ink);
}
.pill-toggle button {
  border: 0;
  background: transparent;
  color: var(--z-sage-dark);
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-family: var(--sans);
  font-weight: 500;
  cursor: pointer;
}
.pill-toggle button.on {
  background: var(--z-brass);
  color: var(--z-ink);
}

/* annotations layer toggle */
body.anno-off .callout { display: none; }
body.anno-off .frame-caption { opacity: 0.55; }

/* variant swap */
.variant-row {
  display: flex;
  gap: 6px;
  align-items: center;
}
.variant-row .v-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--z-sage-dark);
  text-transform: uppercase;
}

/* Mini divider on phones */
.hairline { height: 1px; background: var(--z-border); margin: 10px 0; }

/* helpers */
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.gap-4 { gap: 4px; } .gap-6 { gap: 6px; } .gap-8 { gap: 8px; } .gap-10 { gap: 10px; } .gap-12 { gap: 12px; } .gap-16 { gap: 16px; }
.mt-4 { margin-top: 4px; } .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.flex-1 { flex: 1; }
.between { justify-content: space-between; }
.center { justify-content: center; }
.items-start { align-items: flex-start; }
.items-end { align-items: flex-end; }
.wrap { flex-wrap: wrap; }

.txt-white { color: var(--z-white); }
.txt-sage { color: var(--z-sage-light); }
.txt-muted { color: var(--z-sage-dark); }
.txt-brass { color: var(--z-brass); }
.txt-income { color: var(--z-income); }
.txt-expense { color: var(--z-expense); }
.txt-debt { color: var(--z-debt); }
.txt-alert { color: var(--z-alert); }

.fs-9 { font-size: 9px; }
.fs-10 { font-size: 10px; }
.fs-11 { font-size: 11px; }
.fs-12 { font-size: 12px; }
.fs-13 { font-size: 13px; }
.fs-14 { font-size: 14px; }
.fs-15 { font-size: 15px; }
.fs-16 { font-size: 16px; }
.fs-18 { font-size: 18px; }
.fs-20 { font-size: 20px; }
.fs-22 { font-size: 22px; }
.fs-24 { font-size: 24px; }
.fs-28 { font-size: 28px; }

.fw-4 { font-weight: 400; }
.fw-5 { font-weight: 500; }
.fw-6 { font-weight: 600; }
.fw-7 { font-weight: 700; }
.fw-8 { font-weight: 800; }

.tight { letter-spacing: -0.02em; }

.radius-s { border-radius: 8px; }
.radius-m { border-radius: 12px; }
.radius-l { border-radius: 16px; }
.radius-xl { border-radius: 20px; }

.p-6 { padding: 6px; } .p-8 { padding: 8px; } .p-10 { padding: 10px; } .p-12 { padding: 12px; } .p-14 { padding: 14px; } .p-16 { padding: 16px; }
.px-8 { padding-left: 8px; padding-right: 8px; }
.px-10 { padding-left: 10px; padding-right: 10px; }
.px-12 { padding-left: 12px; padding-right: 12px; }
.py-6 { padding-top: 6px; padding-bottom: 6px; }
.py-8 { padding-top: 8px; padding-bottom: 8px; }
.py-10 { padding-top: 10px; padding-bottom: 10px; }

/* notes / callouts inline */
.note-line {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  font-family: var(--hand);
  font-size: 14px;
  color: var(--z-brass);
  line-height: 1.35;
}
.note-line::before {
  content: '';
  display: block;
  width: 12px;
  height: 1px;
  background: var(--z-brass);
  margin-top: 10px;
  flex-shrink: 0;
  opacity: 0.7;
}

.lane-wrap {
  position: relative;
  padding-top: 6px;
}

/* subtle wobble on hover for phones */
@media (prefers-reduced-motion: no-preference) {
  .phone { transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .phone:hover { transform: translateY(-4px); }
}

</style>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">

// ====== primitives ======
/* global React */
// Primitives for Zeta wireframe storyboards.
// All components exposed via window.* for cross-file use.

const { useState, useEffect, useRef, useMemo, Fragment } = React;

// ---------- Phone frame ----------
function Phone({ title, children, tab = "home", status = "9:41", ...rest }) {
  return (
    <div className="phone" {...rest}>
      <div className="phone-notch" />
      <div className="phone-screen">
        <div className="phone-status">
          <span>{status}</span>
          <span style={{display:'flex', gap:6, opacity:0.8}}>
            <span>•••</span><span>▴▾</span><span>▮</span>
          </span>
        </div>
        <div className="phone-body">
          {children}
        </div>
        <TabBar active={tab} />
      </div>
    </div>
  );
}

function TabBar({ active = "home", variant = "default" }) {
  // Rethought nav (user wants 5 slots rethought). We expose a variant so different flows can show different nav.
  const slots = variant === "alt"
    ? [
        { id: "home", label: "Home", ico: "◻︎" },
        { id: "money", label: "Money", ico: "⇆" },
        { id: "add", label: "+", ico: "+" , fab: true },
        { id: "plan", label: "Plan", ico: "◔" },

// ---------- Frame slot ----------
function Frame({ n, step, children, caption, captionJsx, width = 300 }) {

function Arrow({ label }) {

        <path d="M36 4 L 42 10 L 36 16" stroke="currentColor" strokeWidth="1.4" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
      {label && <span className="hand fs-12 txt-brass" style={{marginLeft: 4}}>{label}</span>}
    </div>
  );
}

// ---------- Sketch chart primitives ----------
function Spark({ values = [3, 5, 4, 7, 6, 9, 7, 8], color = "var(--z-sage)", height = 28 }) {
  const w = 100; const h = height;
  const max = Math.max(...values); const min = Math.min(...values);
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - ((v - min) / (max - min || 1)) * h * 0.8 - 2;
    return `${x},${y}`;
  }).join(" ");
  return (
    <svg className="spark" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function Ring({ pct = 57, size = 46, color = "var(--z-sage)", label, sub }) {
  const r = (size - 6) / 2;
  const c = 2 * Math.PI * r;
  return (
    <div style={{position:'relative', width: size, height: size, display:'flex', alignItems:'center', justifyContent:'center'}}>
      <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(217,204,185,0.12)" strokeWidth="2.5"/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="2.5"
          strokeDasharray={`${c * pct/100} ${c}`} strokeLinecap="round" />
      </svg>
      <div style={{position:'absolute', textAlign:'center', fontSize: 10, color:'var(--z-white)', fontWeight: 600}}>
        {label ?? `${pct}%`}
        {sub && <div className="mono fs-9 txt-muted" style={{marginTop: -1}}>{sub}</div>}
      </div>
    </div>
  );
}

function Bar({ pct = 50, color = "var(--z-sage)", height = 4 }) {
  return (
    <div className="bar-track" style={{height}}>
      <div className="bar-fill" style={{width: `${Math.min(pct, 100)}%`, background: color}}/>
    </div>
  );
}

function SegBar({ segments = [] }) {
  const total = segments.reduce((s, x) => s + x.pct, 0) || 100;
  return (
    <div className="bar-track" style={{display:'flex', height: 6}}>
      {segments.map((s, i) => (
        <div key={i} style={{width: `${s.pct/total*100}%`, background: s.color}}/>
      ))}
    </div>
  );
}

// Eyebrow
function EB({ children, style }) {
  return <div className="eyebrow" style={style}>{children}</div>;
}

// Phone header
function PhoneHeader({ title, sub, right, back }) {

}

// Section divider with eyebrow
function SecDivider({ label }) {

// Stat tile
function Tile({ label, value, sub, tone = "sage", children, dashed }) {
  const tones = {

// Txn row
function TxnRow({ name, cat, amount, tone = "expense", account = "Ahorros", tag }) {

// Flow-strip wrapper
function FlowStrip({ id, kicker, title, subtitle, children }) {
  return (
    <section className="flow-strip" id={id}>

      <div className="flow-strip-head">

      <div className="flow-strip-rail">
        {children}
      </div>
    </section>
  );
}

// Variant strip — show 3 options side by side
function VariantStrip({ label, notes, children }) {
  return (
    <section className="flow-strip">

                      {isBill && <span style={{width:4,height:4,borderRadius:999,background:'var(--z-debt)'}}/>}
                      {isIncome && <span style={{width:4,height:4,borderRadius:999,background:'var(--z-income)'}}/>}
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="row gap-12 mt-12 wrap">
              <Dot color="var(--z-brass)">Spending</Dot>
              <Dot color="var(--z-debt)">Bill</Dot>

        </Frame>
      </FlowStrip>

      {/* ───────────────────────── 8. Type system ───────────────────────── */}
      <section className="flow-strip" id="r2-type">
        <div className="flow-kicker">R2-08 · Type system</div>
        <div className="flow-strip-head">

              <SecDivider label="HAND · KALAM"/>
              <div className="fs-11 txt-muted">wireframe notes only — not for production</div>
              <div className="hand fs-16 txt-sage mt-8">design notes, reasoning</div>

              <SecDivider label="MONO · JETBRAINS"/>
              <div className="fs-11 txt-muted">eyebrows, codes, labels</div>
              <div className="mono fs-10 txt-brass mt-8" style={{letterSpacing:'0.18em'}}>APR 17 · THU · DAY 107</div>
            </div>
          </Frame>

          <Arrow/>

          <Frame n="T2" step="Where accent shows up" captionJsx={<span>Reserved for <b>3 specific moments</b>. Using it anywhere else dilutes it.</span>} width={360}>
            <div className="col gap-10">
              <div className="sketch-box sketch-fill p-12">
                <EB>1 · SUCCESS MOMENTS</EB>
                <div className="accent fs-22 txt-income mt-8" style={{fontStyle:'italic'}}>PIN saved.</div>
                <div className="accent fs-22 txt-income" style={{fontStyle:'italic'}}>Imported 184 txns.</div>
              </div>

              <div className="sketch-box sketch-fill p-12">
                <EB>2 · NARRATIVE HEADLINES</EB>
                <div className="fs-14 txt-white mt-8" style={{lineHeight:1.4, fontFamily:'var(--sans)'}}>
                  You've spent <span className="accent txt-brass" style={{fontStyle:'italic', fontSize:18}}>below pace</span> for day 17.
                </div>
              </div>

              <div className="sketch-box sketch-fill p-12">
                <EB>3 · EMPTY STATES</EB>
                <div className="accent fs-18 txt-sage-dark mt-8" style={{fontStyle:'italic', textAlign:'center'}}>No debts. Nice.</div>
              </div>

              <div className="dashed-box-brass p-10">
                <div className="hand fs-13 txt-brass">Rule: max 1 accent phrase per screen.</div>
              </div>
            </div>
          </Frame>

          <Arrow/>

          <Frame n="T3" step="Swap via Tweaks" captionJsx={<span>Three alternate accent faces ready in Tweaks. Same italic role, different voice.</span>} width={360}>
            <div className="col gap-10">
              <div className="sketch-box sketch-fill p-12">
                <div className="row between">
                  <EB>INSTRUMENT SERIF</EB>
                  <span className="chip chip-brass">current</span>
                </div>
                <div className="accent fs-22 txt-white mt-8" style={{fontFamily:"'Instrument Serif', serif", fontStyle:'italic'}}>Your money, legible.</div>
                <div className="fs-10 txt-muted mt-4">elegant, editorial, calm</div>
              </div>

              <div className="sketch-box sketch-fill p-12">
                <EB>FRAUNCES</EB>
                <div className="fs-22 txt-white mt-8" style={{fontFamily:"'Fraunces', serif", fontStyle:'italic', fontWeight:500}}>Your money, legible.</div>
                <div className="fs-10 txt-muted mt-4">friendlier, more personality</div>
              </div>

              <div className="sketch-box sketch-fill p-12">
                <EB>DM SERIF DISPLAY</EB>
                <div className="fs-22 txt-white mt-8" style={{fontFamily:"'DM Serif Display', serif", fontStyle:'italic'}}>Your money, legible.</div>
                <div className="fs-10 txt-muted mt-4">bolder, more declarative</div>
              </div>

              <div className="note-line mt-4">Toggle in the Tweaks panel — applies across the app.</div>
            </div>
          </Frame>
        </div>
      </section>

      {/* ───────────────────────── Closing ───────────────────────── */}
      <section style={{padding: '24px 40px 60px'}}>
        <div className="banner">
          <div style={{flex: 1, minWidth: 220}}>
            <div className="banner-kicker">NEXT</div>
            <div className="fs-20 fw-6 txt-white mt-8" style={{lineHeight:1.3}}>
              Light theme + every remaining screen.
            </div>
            <div className="hand fs-15 txt-sage mt-8" style={{lineHeight:1.45}}>
              Once these seven are settled, I'll take one more pass to finish any remaining screens,
              then branch into a light-theme pass. Light theme needs the whole dark one locked first,
              so we don't re-do color decisions twice.
            </div>
          </div>
        </div>
      </section>
    </>
  );
}

window.Round2 = Round2;

  { id: 'overview', num: '00', name: 'Intro', render: Intro },
  { id: 'onboarding', num: '01', name: 'Onboarding', render: OnboardingFlow },
  { id: 'home', num: '02', name: 'Home · Daily use', render: HomeFlow },
  { id: 'add', num: '03', name: 'Add txn (+ FAB)', render: AddFlow },
  { id: 'import', num: '04', name: 'Import PDF', render: ImportFlow },
  { id: 'plan', num: '05', name: 'Plan / Monthly', render: PlanFlow },
  { id: 'settings', num: '06', name: 'Settings / Me', render: SettingsFlow },
  { id: 'round2', num: 'R2', name: 'Deep dives (R2)', render: Round2 },
  { id: 'round25', num: 'R2.5', name: 'Hero · Feed · Pending', render: Round25 },
  { id: 'afford', num: '07', name: 'Can I afford it?', render: AffordFlow },
  { id: 'system', num: '08', name: 'System rules', render: SystemFixes },
  { id: 'all', num: '∞', name: 'All flows', render: AllFlows },
];

// ------ Tweak panel ------
const TWEAKS = /*EDITMODE-BEGIN*/{
  "annotationsOn": true,
  "density": "comfortable",
  "defaultFlow": "overview"
}/*EDITMODE-END*/;

function TweaksPanel({ open, setOpen, annoOn, setAnnoOn }) {
  if (!open) {
    return (
      <button className="tweaks-fab" onClick={() => setOpen(true)}>
        <span style={{fontFamily:'var(--hand)', fontSize: 16}}>✎</span>
        Tweaks
      </button>
    );
  }
  return (
    <>
      <div className="tweaks-panel">
        <div className="row between items-center">
          <h4>Tweaks</h4>
          <button onClick={() => setOpen(false)} style={{background:'none', border:0, color:'var(--z-sage-dark)', fontSize:16, cursor:'pointer'}}>×</button>
        </div>
        <div className="tweaks-row">
          <span>Annotations</span>
          <div className="pill-toggle">
            <button className={annoOn ? 'on' : ''} onClick={() => setAnnoOn(true)}>On</button>
            <button className={!annoOn ? 'on' : ''} onClick={() => setAnnoOn(false)}>Off</button>
          </div>
        </div>
        <div className="tweaks-row">
          <span className="fs-11 txt-muted" style={{lineHeight: 1.4}}>Jump to flow via the tabs above.</span>
        </div>
      </div>
    </>
  );
}

// ------ Root ------
function App() {
  const saved = typeof localStorage !== 'undefined' ? localStorage.getItem('zeta-flow') : null;
  const [flow, setFlow] = useState(saved || TWEAKS.defaultFlow || 'overview');
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [annoOn, setAnnoOn] = useState(TWEAKS.annotationsOn);

  useEffect(() => {
    if (typeof localStorage !== 'undefined') localStorage.setItem('zeta-flow', flow);
    document.body.classList.toggle('anno-off', !annoOn);
  }, [flow, annoOn]);

  // Tweaks message protocol
  useEffect(() => {
    function onMsg(e) {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
    }
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const Current = FLOWS.find(f => f.id === flow)?.render || Intro;

  return (
    <div className="storyboard-shell" data-screen-label="01 Zeta Wireframes">
      <div className="flow-nav">
        {FLOWS.map(f => (
          <button key={f.id}
            className={flow === f.id ? 'active' : ''}
            onClick={() => setFlow(f.id)}>
            <span className="flow-num">{f.num}</span>
            {f.name}
          </button>
        ))}
      </div>

      <Current/>

      <TweaksPanel open={tweaksOpen} setOpen={setTweaksOpen} annoOn={annoOn} setAnnoOn={(v) => {
        setAnnoOn(v);
        window.parent.postMessage({ type:'__edit_mode_set_keys', edits: { annotationsOn: v }}, '*');
      }}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
